# Nginx Reverse Proxy Configuration for CloudBeats
# Place in: /etc/nginx/sites-available/cloudbeats
# Link to:  sudo ln -s /etc/nginx/sites-available/cloudbeats /etc/nginx/sites-enabled/
# Then run: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _;

    # Increase max upload size for audio MP3 files
    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

